version: 0.2

# Used by deployment/deploy-codebuild.sh to build the AgentCore container on
# CodeBuild's native ARM64 compute (aws/codebuild/amazonlinux2-aarch64-standard)
# instead of emulating ARM64 with QEMU on a local x86 machine. Requires
# privilegedMode=true on the CodeBuild project (set by deploy-codebuild.sh) so
# the build phase can run its own Docker daemon.
#
# Expects these environment variables on the CodeBuild project:
#   AWS_ACCOUNT_ID, AWS_DEFAULT_REGION, IMAGE_REPO_NAME
#   COCKROACHDB_CLUSTER_ID (optional — bakes that cluster's CA cert into the
#   image at build time; see Dockerfile and src/memory/db.py)

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - REPO_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME"
  build:
    commands:
      - echo "Building the AgentCore image (native ARM64 — no --platform flag needed)..."
      - docker build --build-arg COCKROACHDB_CLUSTER_ID="${COCKROACHDB_CLUSTER_ID:-}" -t "$IMAGE_REPO_NAME:latest" .
      - docker tag "$IMAGE_REPO_NAME:latest" "$REPO_URI:latest"
  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push "$REPO_URI:latest"
      - echo "Pushed $REPO_URI:latest"
