# Static configuration for the MemoryMesh Agent AgentCore Runtime
# This file contains configuration that doesn't change between deployments

aws:
  region: us-east-1
  # account_id is auto-detected during deployment

runtime:
  name: memorymesh_agent_workflow
  role_name: memorymesh-agentcore-runtime-role
  ecr_repo: memorymesh-agent-repo

# The public-facing FastAPI + React app (server/, web/) — a separate
# deployment from the AgentCore runtime above. See deployment/deploy-ecs-web.sh.
web:
  ecr_repo: memorymesh-agent-web-repo
  service_name: memorymesh-agent-web
  port: 8000
